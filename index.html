  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('bo.theme')==='light'?'light':'dark')}catch(e){}</script>
  <link rel="stylesheet" href="./assets/inter.css">
  <link rel="stylesheet" href="./assets/bo-theme.css?v=20261023-1">
  <style>
    html, body { height: 100%; }
    body { overflow: hidden; font-size: 14px; }
    .ic { width: 18px; height: 18px; }

    /* ---------- header ---------- */
    .h { position: relative; z-index: 40; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 20px 0 16px; background: linear-gradient(180deg, var(--header-glow) 0%, transparent 100%), var(--background-surface); border-bottom: 1px solid var(--border-default); }
    .burger { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--content-secondary); }
    .burger:hover { background: var(--hover); color: var(--content-primary); }
    .emb { width: 40px; height: 40px; flex: none; }
    .brand { min-width: 0; line-height: 1.2; }
    .brand b { display: block; font-size: 12.5px; font-weight: 800; letter-spacing: .01em; color: var(--content-primary); }
    .brand span { display: block; font-size: 9.5px; color: var(--content-secondary); max-width: 150px; }
    .hr { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .tbtn { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--content-secondary); display: flex; align-items: center; justify-content: center; }
    .tbtn:hover { background: var(--hover); color: var(--content-primary); }
    .user { position: relative; }
    .ubtn { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 4px 6px; border-radius: 10px; text-align: left; }
    .ubtn:hover { background: var(--hover); }
    .av { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #a855f7); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
    .side > * { flex-shrink: 0; }
    .ubtn .ut b { display: block; font-size: 14px; color: var(--content-primary); }
    .ubtn .ut span { display: block; font-size: 12px; color: var(--content-secondary); }
    .umenu { position: absolute; right: 0; top: 50px; width: 280px; background: var(--background-elevated); border: 1px solid var(--border-default); border-radius: 10px; box-shadow: var(--shadow-pop); padding: 6px; display: none; }
    .umenu.on { display: block; }
    .umenu .hd { padding: 10px 10px 8px; border-bottom: 1px solid var(--border-default); margin-bottom: 6px; }
    .umenu .hd b { display: block; font-size: 13px; }
    .umenu .hd span { font-size: 12px; color: var(--content-secondary); }
    .umenu .lb { font-size: 11px; font-weight: 700; color: var(--content-tertiary); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 4px; }
    .umenu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--content-primary); }
    .umenu button:hover { background: var(--hover); }
    .umenu button .ok { margin-left: auto; color: var(--content-brand); }
    .umenu button .n { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px; background: #DC2626; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .umenu hr { border: 0; border-top: 1px solid var(--border-default); margin: 6px 0; }
    .umenu .out { color: var(--st-err); }

    /* ---------- tata letak ---------- */
    .body { display: flex; height: calc(100vh - 64px); }
    .side { width: 240px; flex: none; background: var(--background-surface); border-right: 1px solid var(--border-default); overflow-y: auto; padding: 12px 8px 20px; display: flex; flex-direction: column; transition: width .15s; }
    .gl { margin: 18px 12px 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--content-secondary); white-space: nowrap; }
    .nav { display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--content-secondary); text-decoration: none; font-size: 14px; text-align: left; margin-bottom: 4px; white-space: nowrap; }
    .nav:hover { background: var(--hover); color: var(--content-primary); }
    .nav.on { background: var(--background-brand); color: #fff; }
    .nav .ic { width: 20px; height: 20px; }
    .nav .nl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .nav .cv { width: 16px; height: 16px; margin-left: auto; transition: transform .15s; }
    .nav.open .cv { transform: rotate(180deg); }
    .nav.par { color: var(--content-primary); }
    .nav.par.inpath { background: var(--background-elevated); }
    .nb { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px; background: #DC2626; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .sub { display: none; padding: 2px 0 6px; }
    .sub.on { display: block; }
    .sub .sg { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--content-tertiary); padding: 10px 12px 4px 44px; }
    .sub a { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 44px; border-radius: 6px; color: var(--content-secondary); text-decoration: none; font-size: 13.5px; margin-bottom: 2px; }
    .sub a:hover { background: var(--hover); color: var(--content-primary); }
    .sub a.on { color: var(--content-primary); background: var(--background-elevated); font-weight: 600; }
    .sub a .nl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub a .bo { font-size: 10px; color: var(--content-tertiary); font-weight: 600; }
    .sfoot { margin-top: auto; padding: 16px 12px 0; font-size: 11px; color: var(--content-tertiary); line-height: 1.5; }
    .sfoot button { margin-top: 6px; border: 1px solid var(--border-strong); background: transparent; color: var(--content-secondary); border-radius: 6px; padding: 4px 8px; font-size: 11px; }
    .sfoot button:hover { color: var(--content-primary); }

    /* rail (sidebar diciutkan / mode workspace) */
    .side.rail { width: 60px; padding: 12px 8px; }
    .side.rail .gl, .side.rail .nl, .side.rail .cv, .side.rail .sub, .side.rail .sfoot, .side.rail .nb { display: none; }
    .side.rail .nav { justify-content: center; padding: 0; height: 44px; }
    .side.rail .gap { height: 10px; }

    /* kolom kedua Workspace */
    .wside { width: 240px; flex: none; background: var(--background-default); border-right: 1px solid var(--border-default); overflow-y: auto; padding: 14px 12px 20px; display: none; }
    .wside.on { display: block; }
    .wside h2 { font-size: 14px; font-weight: 600; margin: 4px 0 8px; }
    .ucsel { position: relative; margin-bottom: 12px; }
    .ucsel > button { display: flex; align-items: center; width: 100%; height: 36px; padding: 0 12px 0 16px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--background-surface); color: var(--content-primary); font-size: 13px; font-weight: 600; text-align: left; }
    .ucsel > button .ic { margin-left: auto; width: 16px; height: 16px; color: var(--content-secondary); }
    .ucm { position: absolute; left: 0; right: 0; top: 40px; z-index: 30; max-height: 60vh; overflow: auto; background: var(--background-elevated); border: 1px solid var(--border-default); border-radius: 8px; box-shadow: var(--shadow-pop); padding: 4px; display: none; }
    .ucm.on { display: block; }
    .ucm button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; text-align: left; font-size: 13px; color: var(--content-primary); }
    .ucm button:hover { background: var(--hover); }
    .ucm button.on { background: var(--background-brand); color: #fff; }
    .ucm button small { margin-left: auto; font-size: 10.5px; color: var(--content-tertiary); }
    .ucm button.on small { color: rgba(255,255,255,.75); }
    .ucm .cat { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--content-tertiary); padding: 8px 10px 2px; }
    .wnav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 6px; color: var(--content-secondary); text-decoration: none; font-size: 14px; margin-bottom: 2px; }
    .wnav:hover { background: var(--hover); color: var(--content-primary); }
    .wnav.on { background: var(--background-brand); color: #fff; }
    .wnav .ic { width: 16px; height: 16px; }
    .wnav span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wnav .nb { margin-left: auto; }
    .obr { margin-top: 18px; padding: 0 12px; }
    .obr .row { display: flex; align-items: center; justify-content: space-between; }
    .obr b { font-size: 14px; }
    .obr button { border: 0; background: none; color: var(--content-secondary); padding: 4px; border-radius: 6px; display: flex; }
    .obr button:hover { background: var(--hover); color: var(--content-primary); }
    .obr p { font-size: 12px; color: var(--content-secondary); margin-top: 6px; line-height: 1.5; }
    .obr a { display: block; font-size: 13px; color: var(--content-secondary); text-decoration: none; padding: 6px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .obr a:hover { color: var(--content-primary); }

    .main { flex: 1; min-width: 0; position: relative; background: var(--background-default); }
    .main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--background-default); }
    .scrim { display: none; }

    /* ---------- login ---------- */
    .login { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--background-default); }
    .login.on { display: flex; }
    .lcard { width: 100%; max-width: 384px; padding: 32px; border: 1px solid var(--border-default); border-radius: 14px; background: var(--background-surface); box-shadow: var(--shadow-pop); text-align: center; }
    .lcard .emb { width: 48px; height: 48px; margin: 0 auto 10px; display: block; }
    .lcard h1 { font-size: 18px; font-weight: 700; }
    .lcard p { font-size: 14px; color: var(--content-secondary); margin: 8px 0 24px; }
    .lcard label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: var(--content-secondary); margin: 0 0 6px; }
    .lcard input { width: 100%; height: 38px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--background-default); color: var(--content-primary); padding: 0 12px; margin-bottom: 16px; font-size: 14px; }
    .lcard input:focus { outline: 2px solid var(--pri-ln); border-color: var(--content-brand); }
    .lcard .go { width: 100%; height: 40px; border: 0; border-radius: 8px; background: var(--action-primary); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
    .lcard .go:hover { background: var(--action-hover); }
    .lcard .err { color: var(--st-err); font-size: 12px; margin: -6px 0 12px; text-align: left; min-height: 0; }
    .lcard small { display: block; margin-top: 20px; font-size: 11.5px; color: var(--content-secondary); line-height: 1.5; }
    .lcard small b { color: var(--content-primary); }

    @media (max-width: 900px) {
      .brand span { display: none; }
      .ubtn .ut { display: none; }
      .side { position: fixed; left: 0; top: 64px; bottom: 0; z-index: 35; transform: translateX(-100%); transition: transform .2s; width: 260px; }
      .side.rail { width: 260px; padding: 12px 8px 20px; }
      .side.rail .gl, .side.rail .nl, .side.rail .cv, .side.rail .sfoot { display: block; }
      .side.rail .nav { justify-content: flex-start; padding: 0 12px; }
      .side.rail .nb { display: inline-flex; }
      .side.mob { transform: none; box-shadow: var(--shadow-pop); }
      .side.rail .sub.on { display: block; }
      .body { flex-direction: column; }
      .wside.on { display: flex; align-items: center; gap: 6px; width: auto; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--border-default); flex: none; }
      .wside h2, .wside .obr { display: none; }
      .wside .ucsel { margin: 0; flex: none; width: 160px; position: static; }
      .wside .ucm { position: fixed; top: 116px; left: 12px; right: 12px; }
      .wnav { flex: none; height: 34px; margin: 0; }
      .main { flex: 1; }
      .scrim.on { display: block; position: fixed; inset: 64px 0 0 0; z-index: 33; background: var(--scrim); }
    }
  </style>
</head>
<body>
  <!-- login demo (sama dengan Backoffice Sitroom) -->
  <div class="login" id="login" role="dialog" aria-modal="true" aria-labelledby="lgT">
    <form class="lcard" id="lgF" autocomplete="off">

      <button class="go" type="submit"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>Masuk</button>
      <small>Gunakan username <b>admin</b> dan password <b>admin</b> untuk masuk.</small>

  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

      <circle cx="24" cy="24" r="22" fill="#241a06" stroke="#7a5a17" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="18.5" fill="none" stroke="#7a5a17" stroke-width="1" stroke-dasharray="1.5 1.8"/>
      <path d="M24 9.5l3.7 8.8 9.5.7-7.3 6.2 2.3 9.2L24 29.3l-8.2 5.1 2.3-9.2-7.3-6.2 9.5-.7z" fill="#c98a12" stroke="#7a5a17" stroke-width=".8"/>
      <path d="M12 37c3 2.6 7.3 4 12 4s9-1.4 12-4" fill="none" stroke="#7a5a17" stroke-width="1.6"/>

  <header class="h">
    <button class="burger" id="burger" type="button" aria-label="Ciutkan menu" aria-controls="side" aria-expanded="true">
      <svg class="ic" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <svg class="emb" viewBox="0 0 48 48" aria-hidden="true"><use href="#emblem"/></svg>
    <div class="brand"><b>BACKOFFICE SITROOM</b><span>Kementerian Sekretariat Negara Republik Indonesia</span></div>
    <div class="hr">
      <button class="tbtn" id="theme" type="button" aria-label="Ganti tema" title="Ganti tema terang/gelap">
        <svg class="ic" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><line x1="17" y1="3" x2="17" y2="5"/><line x1="21" y1="7" x2="19" y2="7"/><line x1="19.8" y1="4.2" x2="18.4" y2="5.6"/></svg>
      </button>

        <button class="ubtn" id="ubtn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="av" id="av">A</span>
          <span class="ut"><b id="uName">—</b><span id="uRole">—</span></span>
          <svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:var(--content-secondary);stroke-width:2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

  <div class="body">
    <aside class="side" id="side" aria-label="Menu utama"></aside>
    <aside class="wside" id="wside" aria-label="Menu workspace"></aside>
    <div class="scrim" id="scrim"></div>
    <main class="main"><iframe id="frame" title="Halaman backoffice"></iframe></main>

  <script src="./data/harmonisasi-data.js?v=20261023-1"></script>
  <script src="./data/harmonisasi-ws.js?v=20261023-1"></script>
  <script src="./assets/bo-store.js?v=20261023-1"></script>
  <script src="./assets/bo-usecases.js?v=20261023-1"></script>
  <script src="./assets/uc-harmonisasi.js?v=20261023-1"></script>
  <script src="./assets/bo-ui.js?v=20261023-1"></script>
  <script>
    (function () {
      'use strict';
      window.__BO_SHELL__ = true;
      var V = '20261023-1';
      var ic = UI.icon, esc = UI.esc, WS = UI.WS;
      var KAT = WS.ws().katalog;
      var UC_ALL = []; KAT.forEach(function (k) { if (k.sub) k.sub.forEach(function (s) { UC_ALL.push({ key: s[0], nama: s[1], cat: k.nama }); }); else UC_ALL.push({ key: k.key, nama: k.nama, aktif: k.aktif }); });
      var ucOf = function (k) { return UC_ALL.filter(function (u) { return u.key === k; })[0]; };
      var OPS = window.BO_USECASES.filter(function (u) { return u.key === 'harmonisasi'; })[0];
      var OPS_PAGES = []; OPS.grup.forEach(function (g) { OPS_PAGES = OPS_PAGES.concat(g.items); }); OPS_PAGES = OPS_PAGES.concat(window.BO_SHARED);

      var frame = document.getElementById('frame'), side = document.getElementById('side'), wside = document.getElementById('wside');
      var cur = { key: null, src: null, sec: null, ws: null, opsPage: null };
      var collapsed = false, opsOpen = true;
      try { collapsed = localStorage.getItem('bo.rail') === '1'; } catch (e) {}

      // ---------- router ----------
      // #dashboard · #workspace/<uc>[/widgets|ews|data-source|assistant][/<id>] · #dashboard-management[/<uc>]
      // #approvals · #users · #roles · #harmonisasi/<halaman>[/<id>] (Operation › Harmonisasi)
      function route() {
        var p = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
        var a = p[0] || 'dashboard';
        if (a === 'dashboard') return { sec: 'dashboard', f: 'app/dashboard.html', title: 'Dashboard' };
        if (a === 'workspace') {
          var uc = ucOf(p[1]) ? p[1] : 'harmonisasi', s = p[2] || 'dashboard', id = p[3] || null;
          var r = { sec: 'workspace', ws: uc, wsub: s, id: id };
          if (uc !== 'harmonisasi') { r.f = 'ws/segera.html'; r.title = ucOf(uc).nama; return r; }
          if (s === 'widgets') { r.f = id ? 'ws/widget.html' : 'ws/widgets.html'; r.title = 'Widget'; }
          else if (s === 'ews') { r.f = id === 'topik' ? 'ws/ews-topik.html' : id ? 'ws/ews-detail.html' : 'ws/ews.html'; r.title = 'Early Warning System'; }
          else if (s === 'data-source') { r.f = id === 'unggah' ? 'ws/unggah.html' : id ? 'ws/data-detail.html' : 'ws/data-source.html'; r.title = 'Data Source'; }
          else if (s === 'assistant') { r.f = id === 'knowledge' ? 'ws/knowledge.html' : 'ws/assistant.html'; r.title = 'AI Training Center'; }
          else { r.wsub = 'dashboard'; r.f = 'ws/dashboard.html'; r.title = 'Dashboard'; }
          return r;
        }
        if (a === 'dashboard-management') return p[1] ? { sec: 'dm', f: 'app/dm-detail.html', id: p[1], title: 'Dashboard Management' } : { sec: 'dm', f: 'app/dm.html', title: 'Dashboard Management' };
        if (a === 'approvals') return { sec: 'approvals', f: 'app/approvals.html', title: 'Approvals', id: p[1] || null };
        if (a === 'users') return { sec: 'users', f: 'app/users.html', title: 'User Management' };
        if (a === 'roles') return { sec: 'roles', f: 'app/roles.html', title: 'Role & Permission' };
        if (a === 'harmonisasi') {
          var it = OPS_PAGES.filter(function (x) { return x.k === p[1]; })[0] || OPS_PAGES[0];
          return { sec: 'ops', ops: it.k, f: it.f, id: p[2] || null, title: it.l };
        }
        return { sec: 'dashboard', f: 'app/dashboard.html', title: 'Dashboard' };
      }

      function load() {
        if (!BO.authed()) { showLogin(); return; }
        document.getElementById('login').classList.remove('on');
        var r = route();
        var src = './pages/' + r.f + '?uc=harmonisasi' + (r.ws ? '&ws=' + r.ws : '') + (r.id ? '&id=' + encodeURIComponent(r.id) : '') + '&v=' + V;
        var key = r.f + '|' + (r.ws || '');
        if (cur.key === key && cur.src && r.sec === 'ops') {
          try { frame.contentWindow.postMessage({ type: 'bo:open', id: r.id }, '*'); } catch (e) {}
        } else if (cur.src !== src) {
          frame.setAttribute('src', src); cur.src = src;
        }
        cur.key = key; cur.r = r;
        document.title = r.title + (r.sec === 'ops' ? ' · Harmonisasi' : '') + ' - Backoffice Sitroom';
        frame.setAttribute('title', r.title);
        if (r.sec === 'ops') opsOpen = true;
        render(); closeMob();
      }

      // ---------- render menu ----------
      function nav(href, icn, label, on, extra) {
        return '<a class="nav' + (on ? ' on' : '') + '" href="#' + href + '"' + (on ? ' aria-current="page"' : '') + ' title="' + esc(label) + '">' + ic(icn) + '<span class="nl">' + esc(label) + '</span>' + (extra || '') + '</a>';
      }
      function render() {
        var r = cur.r || route(), role = BO.role();
        var inWs = r.sec === 'workspace';
        var rail = collapsed || inWs;
        side.classList.toggle('rail', rail);
        var badges = (window.BO_UC.harmonisasi.badges || function () { return {}; })();
        var nTodo = WS.todo().filter(function (x) { return x.mine; }).length;
        var nAppr = role.key === 'approver' ? WS.approvals().length : 0;
        var h = nav('dashboard', 'grid', 'Dashboard', r.sec === 'dashboard', nTodo ? '<span class="nb">' + nTodo + '</span>' : '');
        h += '<div class="gl">AI Center</div><div class="gap"></div>';
        h += nav('workspace/harmonisasi', 'rocket', 'Workspace', inWs);
        h += nav('dashboard-management', 'layout', 'Dashboard Management', r.sec === 'dm');
        h += nav('approvals', 'check', 'Approvals', r.sec === 'approvals', nAppr ? '<span class="nb">' + nAppr + '</span>' : '');
        h += '<div class="gl">Operation</div><div class="gap"></div>';
        var opsOn = r.sec === 'ops';
        h += '<a class="nav par' + (opsOn ? ' inpath' : '') + (opsOpen ? ' open' : '') + '" href="#harmonisasi/overview" id="opsT" aria-expanded="' + opsOpen + '" title="Harmonisasi">' + ic('list') + '<span class="nl">Harmonisasi</span>' + ic('chev', 'cv') + '</a>';
        h += '<div class="sub' + (opsOpen ? ' on' : '') + '">';
        OPS.grup.forEach(function (g) {
          h += '<div class="sg">' + esc(g.l) + '</div>';
          g.items.forEach(function (it) { h += subLink(it, badges[it.k], r); });
        });
        h += '<div class="sg">Administrasi</div>';
        window.BO_SHARED.forEach(function (it) { h += subLink(it, it.k === 'notifikasi' ? BO.unread('harmonisasi') : null, r); });
        h += '</div>';
        h += '<div class="gl">User</div><div class="gap"></div>';
        h += nav('users', 'users', 'User Management', r.sec === 'users');
        h += nav('roles', 'key', 'Role & Permission', r.sec === 'roles');
        h += '<div class="sfoot">Prototipe · data simulasi per 16 Oktober 2026. Perubahan tersimpan di peramban ini saja.<br><button type="button" id="reset">Atur ulang data simulasi</button></div>';
        side.innerHTML = h;

        // kolom workspace
        wside.classList.toggle('on', inWs);
        if (inWs) {
          var u = ucOf(r.ws), act = u.aktif, base = 'workspace/' + r.ws;
                    var w = '<h2>Usecase</h2><div class="ucsel"><button type="button" id="ucB" aria-haspopup="listbox" aria-expanded="false">' + esc(u.nama) + ic('chev') + '</button><div class="ucm" id="ucM" role="listbox">';
          var opt = function (x) { return '<button type="button" role="option" data-uc="' + x.key + '" class="' + (x.key === r.ws ? 'on' : '') + '" aria-selected="' + (x.key === r.ws) + '">' + esc(x.nama) + (x.aktif ? '' : '<small>Segera</small>') + '</button>'; };
          UC_ALL.filter(function (x) { return !x.cat; }).forEach(function (x) { w += opt(x); });
          KAT.filter(function (k) { return k.sub; }).forEach(function (k) {
            w += '<div class="cat">' + esc(k.nama) + '</div>';
            UC_ALL.filter(function (x) { return x.cat === k.nama; }).forEach(function (x) { w += opt(x); });
          });
          w += '</div></div>';
          [['dashboard', 'dash', 'Dashboard'], ['widgets', 'widget', 'Widget'], ['ews', 'alert', 'Early Warning System'], ['data-source', 'db', 'Data Source'], ['assistant', 'spark', 'AI Training Center']].forEach(function (s) {
            var on = r.wsub === s[0];
            w += '<a class="wnav' + (on ? ' on' : '') + '" href="#' + base + (s[0] === 'dashboard' ? '' : '/' + s[0]) + '"' + (on ? ' aria-current="page"' : '') + '>' + ic(s[1]) + '<span>' + s[2] + '</span>' + (s[3] ? '<span class="nb">' + s[3] + '</span>' : '') + '</a>';
          });
          var chats = []; try { chats = JSON.parse(localStorage.getItem('bo.chat.harmonisasi') || '[]'); } catch (e) {}
          w += '<div class="obr"><div class="row"><b>Obrolan</b><button type="button" id="newChat" aria-label="Obrolan baru">' + ic('plus') + '</button></div>' +
            (act && chats.length ? chats.slice(0, 6).map(function (c, i) { return '<a href="#' + base + '/assistant">' + esc(c.q) + '</a>'; }).join('') : '<p>Belum ada percakapan. Mulai dengan tombol +.</p>') + '</div>';
          wside.innerHTML = w;
        }

        // header
        document.getElementById('av').textContent = role.nama.charAt(0);
        document.getElementById('uName').textContent = role.nama;
        document.getElementById('uRole').textContent = role.key === 'approver' ? 'Approver' : 'Analyst';
        renderUserMenu();
      }
      function subLink(it, badge, r) {
        var on = r.sec === 'ops' && r.ops === it.k;
        return '<a href="#harmonisasi/' + it.k + '" class="' + (on ? 'on' : '') + '"' + (on ? ' aria-current="page"' : '') + '><span class="nl">' + esc(it.l) + '</span>' + (badge ? '<span class="nb">' + badge + '</span>' : (it.bo ? '<span class="bo">' + it.bo + '</span>' : '')) + '</a>';
      }
      function renderUserMenu() {
        var role = BO.role(), n = BO.unread('harmonisasi'), th = BO.theme();
        document.getElementById('umenu').innerHTML =
          '<div class="hd"><b>' + esc(role.nama) + '</b><span>' + esc(role.unit) + '</span></div>' +
          '<div class="lb">Peran simulasi</div>' +
          ['analis', 'approver'].map(function (k) { return '<button type="button" role="menuitemradio" aria-checked="' + (role.key === k) + '" data-role="' + k + '">' + ic(k === 'analis' ? 'user' : 'shield') + (k === 'analis' ? 'Analyst' : 'Approver') + (role.key === k ? ic('ok', 'ok') : '') + '</button>'; }).join('') +
          '<hr><button type="button" role="menuitem" data-go="harmonisasi/notifikasi">' + ic('alertc') + 'Notifikasi' + (n ? '<span class="n">' + (n > 99 ? '99+' : n) + '</span>' : '') + '</button>' +
          '<button type="button" role="menuitem" data-go="harmonisasi/audit">' + ic('hist') + 'Audit Trail</button>' +
          '<button type="button" role="menuitem" data-theme-t="1">' + ic(th === 'dark' ? 'eye' : 'eye') + (th === 'dark' ? 'Tema terang' : 'Tema gelap') + '</button>' +
          '<hr><button type="button" role="menuitem" class="out" data-logout="1">' + ic('lock') + 'Keluar</button>';
      }

      // ---------- login ----------
      function showLogin() { document.getElementById('login').classList.add('on'); setTimeout(function () { document.getElementById('lgU').focus(); }, 30); }
      document.getElementById('lgF').addEventListener('submit', function (e) {
        e.preventDefault();
        var u = document.getElementById('lgU').value.trim(), p = document.getElementById('lgP').value;
        if (BO.login(u, p)) { document.getElementById('login').classList.remove('on'); document.getElementById('lgE').textContent = ''; load(); }
        else document.getElementById('lgE').textContent = 'Username atau password salah.';
      });

      // ---------- event ----------
      function closeMob() { side.classList.remove('mob'); document.getElementById('scrim').classList.remove('on'); }
      var mq = window.matchMedia('(max-width: 900px)');
      document.getElementById('burger').addEventListener('click', function () {
        if (mq.matches) { var on = !side.classList.contains('mob'); side.classList.toggle('mob', on); document.getElementById('scrim').classList.toggle('on', on); this.setAttribute('aria-expanded', on); return; }
        collapsed = !collapsed; try { localStorage.setItem('bo.rail', collapsed ? '1' : '0'); } catch (e) {}
        this.setAttribute('aria-expanded', !collapsed); render();
      });
      document.getElementById('scrim').addEventListener('click', closeMob);
      document.getElementById('theme').addEventListener('click', function () { BO.setTheme(BO.theme() === 'dark' ? 'light' : 'dark'); renderUserMenu(); });
      var ub = document.getElementById('ubtn'), um = document.getElementById('umenu');
      ub.addEventListener('click', function (e) { e.stopPropagation(); var on = !um.classList.contains('on'); um.classList.toggle('on', on); ub.setAttribute('aria-expanded', on); });
      um.addEventListener('click', function (e) {
        e.stopPropagation();
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.role) BO.setRole(b.dataset.role);
        if (b.dataset.go) location.hash = b.dataset.go;
        if (b.dataset.themeT) BO.setTheme(BO.theme() === 'dark' ? 'light' : 'dark');
        if (b.dataset.logout) { BO.logout(); cur.src = null; frame.removeAttribute('src'); showLogin(); }
        um.classList.remove('on'); ub.setAttribute('aria-expanded', 'false');
      });
      side.addEventListener('click', function (e) {
        var t = e.target.closest('#opsT');
        if (t) { var r = cur.r || {}; if (r.sec === 'ops' && !side.classList.contains('rail')) { e.preventDefault(); opsOpen = !opsOpen; render(); } return; }
        if (e.target.id === 'reset' && confirm('Atur ulang seluruh perubahan simulasi di peramban ini?')) {
          BO.reset(); try { localStorage.removeItem('bo.chat.harmonisasi'); } catch (x) {} frame.contentWindow.location.reload();
        }
      });
      wside.addEventListener('click', function (e) {
        var b = e.target.closest('#ucB'), m = document.getElementById('ucM');
        if (b) { e.stopPropagation(); var on = !m.classList.contains('on'); m.classList.toggle('on', on); b.setAttribute('aria-expanded', on); return; }
        var o = e.target.closest('[data-uc]');
        if (o) { location.hash = 'workspace/' + o.dataset.uc; return; }
        if (e.target.closest('#newChat')) { location.hash = 'workspace/' + (cur.r.ws || 'harmonisasi') + '/assistant'; try { frame.contentWindow.postMessage({ type: 'bo:open', id: 'new' }, '*'); } catch (x) {} }
      });
      document.addEventListener('click', function () { um.classList.remove('on'); ub.setAttribute('aria-expanded', 'false'); var m = document.getElementById('ucM'); if (m) m.classList.remove('on'); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { um.classList.remove('on'); var m = document.getElementById('ucM'); if (m) m.classList.remove('on'); closeMob(); } });

      window.addEventListener('message', function (e) {
        var d = e.data; if (!d || typeof d !== 'object' || e.source !== frame.contentWindow) return;
        if (d.type === 'bo:nav' && typeof d.path === 'string') location.hash = d.path;
        if (d.type === 'bo:route' && typeof d.path === 'string' && history.replaceState) history.replaceState(null, '', '#' + d.path);
        if (d.type === 'bo:chat') render();
      });
      // tema ikut ke iframe yang baru dimuat
      frame.addEventListener('load', function () { try { frame.contentDocument.documentElement.setAttribute('data-theme', BO.theme()); } catch (e) {} });
      window.addEventListener('hashchange', load);
      BO.on(render);
      load();
    })();
  </script>
</body>
</html>
